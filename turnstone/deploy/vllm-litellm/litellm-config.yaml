# LiteLLM gateway config — base (overlay-neutral).
# Dev/prod overlays are merged by litellm-entrypoint.sh at boot.
model_list:
  - model_name: qwen3.6-27b
    litellm_params:
      model: anthropic/qwen3.6-27b
      api_base: http://vllm-qwen:8000
      api_key: dummy
      cooldown_time: 30
      timeout: 600
      stream_timeout: 300
  - model_name: gemma-4-12b
    litellm_params:
      model: openai/gemma-4-12b
      api_base: http://vllm-gemma:8000/v1
      api_key: dummy
      cooldown_time: 30
      timeout: 300
      stream_timeout: 300

litellm_settings:
  drop_params: true
  request_timeout: 600
  stream_timeout: 300
  num_retries: 3
  retry_policy: ["RateLimitError", "TimeoutError", "ServiceUnavailableError"]
  cooldowns:
    default: 30
  max_budget: ${MAX_BUDGET_USD:-0}
